name: GenSprout
version: 1.2.0-beta1
main: com.github.gensprout.GenSprout
api-version: '1.21'
description: Optimized generator & farming plugin with custom block gens, crop region harvesting, Vault economy, prestige, hoe enchants & Paper Dialog UIs.
author: chyarogroup
dependencies:
  server:
    Vault:
      load: BEFORE
      required: false

permissions:
  gensprout.admin:
    description: Allows players to use admin features of GenSprout.
    default: op
  gensprout.tester:
    description: Allows players to run /start multiple times to receive tutorial starter items for testing.
    default: op