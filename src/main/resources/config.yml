# Hoe Enchantment Settings
hoe-enchants:
  # Enchantment prices (in essence): base-cost + (current_level * cost-multiplier)
  xp_booster:
    display-name: "<yellow>XP Booster</yellow>"
    max-level: 5
    base-cost: 100
    cost-multiplier: 50
    effect-per-level: 0.20 # +20% farming XP per level
  essence_finder:
    display-name: "<light_purple>Essence Finder</light_purple>"
    max-level: 5
    base-cost: 150
    cost-multiplier: 75
    effect-per-level: 0.25 # +25% essence chance/amount per level
  crop_doubler:
    display-name: "<green>Crop Doubler</green>"
    max-level: 5
    base-cost: 200
    cost-multiplier: 100
    effect-per-level: 0.10 # +10% chance to double crop drops per level
  replenish:
    display-name: "<aqua>Replenish</aqua>"
    max-level: 1
    base-cost: 250
    cost-multiplier: 0
  harvest_area:
    display-name: "<gold>Harvest Area (3x3)</gold>"
    max-level: 1
    base-cost: 500
    cost-multiplier: 0

# ==========================================
# Server Customization Settings (IP, Name, etc.)
# ==========================================
server:
  # The IP address displayed on the scoreboard and tab list footer
  ip: "play.gensprout.net"
  # The display name of the server (supports MiniMessage color formatting)
  name: "<gradient:green:aqua><bold>GENSPROUT MC</bold></gradient>"
  # A short description tagline for the server
  tagline: "<gray>The ultimate optimized farming server</gray>"

# ==========================================
# Scoreboard Customization
# ==========================================
scoreboard:
  # Enable/disable the custom sidebar scoreboard
  enabled: true
  # How often the scoreboard updates (20 ticks = 1 second)
  update-interval-ticks: 20
  # Objective title at the top of the scoreboard (supports MiniMessage color formatting)
  title: "<gradient:green:aqua><bold>GENSPROUT</bold></gradient>"
  # Configurable lines shown in the scoreboard sidebar
  # Available dynamic placeholders:
  #   {player}       - Current player's name
  #   {level}        - Current farming level
  #   {xp}           - Current farming XP formatted to 1 decimal place
  #   {prestige}     - Current prestige tier
  #   {essence}      - Current farming essence count
  #   {placed_gens}  - Count of generators placed by this player
  #   {max_gens}     - Maximum slots allowed for this player
  #   {balance}      - Vault economy balance formatted
  #   {server_ip}    - Server IP defined under 'server.ip'
  #   {server_name}  - Server name defined under 'server.name'
  #   {online}       - Total online players on the server
  #   {ping}         - Current player's ping in ms
  lines:
    - "<gray>-------------------</gray>"
    - "<gray>Player: <yellow>{player}</yellow></gray>"
    - "<gray>Level: <gold>{level}</gold></gray>"
    - "<gray>XP: <gold>{xp}</gold></gray>"
    - "<gray>Prestige: <gold>{prestige}</gold></gray>"
    - "<gray>Essence: <light_purple>{essence}</light_purple></gray>"
    - "<gray>Placed Gens: <gold>{placed_gens}/{max_gens}</gold></gray>"
    - "<gray>Balance: <green>{balance}</green></gray>"
    - "<gray>-------------------</gray>"
    - "{server_ip}"

# ==========================================
# Tab List (Header & Footer) Customization
# ==========================================
tablist:
  # Enable/disable custom tab list headers and footers
  enabled: true
  # Top message inside the tab menu (supports MiniMessage color formatting & placeholders)
  header: "\n{server_name}\n{tagline}\n"
  # Bottom message inside the tab menu (supports MiniMessage color formatting & placeholders)
  footer: "\n<gray>Online Players: <gold>{online}</gold> | Ping: <gold>{ping}ms</gold></gray>\n{server_ip}\n"
