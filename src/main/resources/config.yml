# Level & Prestige Settings
leveling:
  # Internal farming leveling calculations.
  # Progression is split into 3 phases so early levels come quickly (to hook new players),
  # mid-game levels ramp up steadily, and late-game levels taper off with sqrt-based growth
  # so the grind never becomes excessively slow.
  #
  # Levels 1 to early-levels:                        required = base-xp + (level * early-multiplier)
  # Levels (early-levels+1) to late-level-threshold:  continues linearly using 'multiplier'
  # Levels above late-level-threshold:                growth tapers off using sqrt(level) * late-multiplier
  formula:
    base-xp: 60
    early-levels: 15
    early-multiplier: 15
    multiplier: 40
    late-level-threshold: 40
    late-multiplier: 25
  
  # Prestige Settings
  # Level required to prestige = base-level + (current_prestige * levels-per-prestige)
  prestige:
    base-level: 20
    levels-per-prestige: 5

# Farming Settings
farming:
  crops:
    WHEAT:
      xp: 10
      essence-chance: 0.10
      essence-amount: 1
      sell-price: 1.5
    POTATOES:
      xp: 12
      essence-chance: 0.12
      essence-amount: 1
      sell-price: 2.0
    CARROTS:
      xp: 12
      essence-chance: 0.12
      essence-amount: 1
      sell-price: 2.0
    BEETROOTS:
      xp: 15
      essence-chance: 0.15
      essence-amount: 1
      sell-price: 3.0
    MELON:
      xp: 8
