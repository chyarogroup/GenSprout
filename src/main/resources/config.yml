# Language Configuration
# Set userLanguages to 'true' to dynamically match each player's Minecraft client language.
# Set userLanguages to a specific language code (e.g., "en", "es", "fr", "de") to force all players to use that language.
language: "en"
userLanguages: true

# Player Hunger Settings
# When set to true, players will never lose hunger or food level (infinite food).
disable-hunger: true

# Generator Settings
generators:
  # General settings
  default-slots: 20
  # Cost to buy an additional slot: base-price + (current_purchased_slots * scaling-factor)
  slot-purchase:
    enabled: true
    base-price: 5000.0
    scaling-factor: 2500.0
  
  # Generator tick interval in seconds
  tick-interval-seconds: 10

  # Generators only produce drops while their chunk is loaded, and pause entirely while
  # unloaded (no "catch-up" dumping of missed drops when the chunk loads back in - see
  # offline-generation below for how missed time offline is instead compensated).
  #
  # To prevent lag/exploits from unattended AFK farms, each generator also stops producing
  # new drops once too many uncollected item entities are sitting nearby (within
  # item-check-radius blocks). Set max-nearby-items to 0 to disable this cap entirely.
  max-nearby-items: 100
  item-check-radius: 12

  # Generator tier cost curve
  # Generator tier cost curve
  # 3-phase economy curve tuned for a ~25 hour total playtime progression to max tier 50:
  # Tiers 1..early-tiers (1..5): starter linear steps ($250 per step)
  # Tiers 6..mid-tier-threshold (6..25): compounding growth rate (mid-growth-rate: 1.28)
  # Tiers 26..50: compounding growth rate (late-growth-rate: 1.32)
  # upgrade-price is always buy-price * upgrade-price-ratio.
  tier-economy:
    base-buy-price: 250.0
    early-tiers: 5
    early-step: 250.0
    mid-tier-threshold: 25
    mid-growth-rate: 1.28
    late-growth-rate: 1.32
    upgrade-price-ratio: 0.80

  # Generator drop value curve
  # 3-phase drop value curve tuned for balanced steady income scaling across 25 hours.
  drop-value-economy:
    base-drop-value: 2.0
    early-tiers: 5
    early-step: 2.0
    mid-tier-threshold: 25
    mid-growth-rate: 1.18
    late-growth-rate: 1.20
    max-drop-value-cap: 30000.0

