# Level & Prestige Settings
leveling:
  # Internal farming leveling calculations
  # XP required = base-xp + (current_level * multiplier)
  formula:
    base-xp: 100
    multiplier: 50
  
  # Prestige Settings
  # Level required to prestige = base-level + (current_prestige * levels-per-prestige)
  prestige:
    base-level: 50
    levels-per-prestige: 10

# Farming Settings
farming:
  crops:
    WHEAT:
      xp: 10
      essence-chance: 0.10
      essence-amount: 1
      sell-price: 1.5
    POTATOES:
