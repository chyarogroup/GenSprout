# ==========================================
# Join MOTD Customization
# ==========================================
# Message displayed in chat every time a player logs onto the server.
motd:
  enabled: true
  # Delay in ticks before sending MOTD after join (default: 15 ticks)
  delay-ticks: 15
  messages:
    - "<gradient:green:aqua><bold>Welcome to {servername}!</bold></gradient>"

# ==========================================
# First Join Tutorial Customization
# ==========================================
# Tutorial presented on /start and on a player's very first join.
first-join-tutorial:
  enabled: true
  # Open as an interactive Paper Dialog UI (true) or send as chat messages (false)
  use-dialog: true
  # Delay in ticks before presenting tutorial to new players (default: 30 ticks)
  delay-ticks: 30
  dialog-title: "<white><bold>{servername} Starter Guide</bold></white>"
  messages:
    - "<white>1. Claim Starter Items</white>"
    - "<gray>Run <yellow>/start</yellow> to receive your starter Sprout Hoe and 20 Tier 1 Generators to kickstart your farm.</gray>"
    - ""
    - "<white>2. Place & Upgrade Generators</white>"
    - "<gray>Place generator blocks on your base. Over time, they spawn valuable drop items. Use <yellow>/genshop</yellow> to buy or upgrade generators.</gray>"
    - ""
    - "<white>3. Base & Building Supplies</white>"
    - "<gray>Visit the Building Shop via <blue>/shop</blue> to purchase building blocks, hoppers, chests, and buckets to expand your setup.</gray>"
    - ""
    - "<white>4. Farm Crops & Level Up</white>"
    - "<gray>Harvest crops in the shared farming zone to gain Farming XP, Essence, and money. Farm crops are 100% instanced per player!</gray>"
    - ""
    - "<white>5. Hoe Upgrades & Sell Wands</white>"
    - "<gray>Use your earned Essence to upgrade your Sprout Hoe with custom enchants (XP Booster, Crop Doubler, Replenish, 3x3 Harvest). Sell items quickly with <yellow>/sell</yellow> or Sell Wands.</gray>"
    - ""
    - "<white>6. Prestige Progression</white>"
    - "<gray>Once you reach the required farming level, use <yellow>/prestige</yellow> to unlock higher tier crop varieties and permanent stat multipliers!</gray>"

# ==========================================
# Start Command Actions Customization
# ==========================================
# Configurable commands to execute when a player runs /start (or /gensprout start).
# Useful for integrations such as automatic plot claiming (e.g. /plot auto).
start-command:
  # Commands executed by the player on /start (leading slash is optional)
  # Placeholders: {player}
  player-commands:
    - "plot auto"
  # Commands executed by the server console on /start
  # Placeholders: {player}
  console-commands: []




