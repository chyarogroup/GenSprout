      essence-amount: 2
      sell-price: 5.0

# ==========================================
# Crop Progression (tied to Prestige)
# ==========================================
# Every `prestiges-per-crop` prestige levels, the next crop in this list "unlocks". Harvesting a
# crop that isn't unlocked yet still breaks/drops the raw item normally (nothing is destroyed),
# but it won't grant Farming XP, Essence, or the auto-sell bonus until it's unlocked - giving
# players a concrete reason to prestige as they grow their farm's variety. The first crop in the
# list is always unlocked for everyone.
#
# Only the 4 "real" farmland crops are gated here (Wheat, Potatoes, Carrots, Beetroot). Melon,
# Pumpkin, Cocoa, Sugar Cane, and Nether Wart are not farmland crops in the traditional sense
# (they grow from stems/vines/soul sand rather than tilled farmland) and are intentionally left
# out of this list - any crop not in this list is always treated as unlocked.
crop-progression:
  prestiges-per-crop: 10
  order:
    - WHEAT
    - POTATOES
    - CARROTS
    - BEETROOTS

# Essence & Generator Slot Upgrade Settings
essence-slots:
  # Base cost in Essence to purchase the first extra generator slot in /genshop
  base-cost: 300
  # Cost increase per slot currently owned (cost = base-cost + (current_essence_slots * scaling-factor))
  scaling-factor: 150
  # Legacy fallback cost per slot
  cost-per-slot: 300
  # Maximum number of extra generator slots buyable with Essence
  max-slots: 25

# Hoe Enchantment Settings
hoe-enchants:
  # Enchantment prices (in essence): base-cost + ((next_level ^ cost-exponent) * cost-multiplier)
  xp_booster:
    display-name: "<yellow>XP Booster</yellow>"
    max-level: 500
    base-cost: 10
    cost-multiplier: 2.0
    cost-exponent: 1.15
    effect-per-level: 0.005 # +0.5% farming XP per level (+250% at lv 500)
  essence_finder:
    display-name: "<light_purple>Essence Finder</light_purple>"
    max-level: 500
    base-cost: 10
    cost-multiplier: 2.0
    cost-exponent: 1.15
    effect-per-level: 0.001 # +0.1% essence chance per level
  crop_doubler:
    display-name: "<green>Crop Doubler</green>"
    max-level: 500
    base-cost: 15
    cost-multiplier: 3.0
    cost-exponent: 1.15
    effect-per-level: 0.002 # +0.2% chance to double crop drops per level (100% at lv 500)
  replenish:
    display-name: "<aqua>Replenish</aqua>"
    max-level: 1
    base-cost: 250
    cost-multiplier: 0
  harvest_area:
    display-name: "<gold>Harvest Area</gold>"
    max-level: 4
    base-cost: 300
    cost-multiplier: 200
    cost-exponent: 1.2
  reach:
    display-name: "<blue>Reach</blue>"
    max-level: 5
    base-cost: 200
    cost-multiplier: 100
    cost-exponent: 1.3
    effect-per-level: 1.0
  auto_sell:
    display-name: "<gold>Auto-Sell (Crops Only)</gold>"
    max-level: 1
    base-cost: 5000
    cost-multiplier: 0

# ==========================================
# Offline Generation Settings
# ==========================================
# When a player rejoins, GenSprout estimates how much money their generators would have
# earned had they been online the whole time they were away, and pays out a percentage of
# that as a welcome-back bonus. This does NOT spawn any physical items - it's a pure balance
# deposit, so it has no interaction with the item entity cap above.
offline-generation:
  enabled: true
  # Percentage of the estimated earnings to actually pay out (0.20 = 20%)
  percentage: 0.20
  # Safety cap: only this many hours of absence are ever considered, so a player who was gone
  # for weeks/months doesn't return to an absurd payout.
  max-offline-hours: 72

# ==========================================
# Auto-Sell Settings
# ==========================================
auto-sell:
  # When enabled, sellable crops and generator drops are sold instantly the moment they are
  # obtained (harvested or picked up), skipping the inventory entirely and depositing straight
  # into the player's balance. Enabled by default. Set to false to let players hoard raw items
  # to sell manually with /sell or a Sell Wand instead.
  enabled: true

# ==========================================
# Sell Wand Settings
# ==========================================
# Sell Wands are items purchasable using Essence from /genshop or /shop.
# When right-clicked on a container (chest/barrel/shulker box), it sells
# all sellable contents inside at the configured multiplier.
sellwand:
  # Multiplier applied to item sell values when using Sell Wand (1.5 = 1.5x)
  multiplier: 1.5
  # Base cost in Essence to purchase a Tier 1 Sell Wand
  essence-cost: 1500
  multipliers:
    1:
      display-name: "<gold><b>Sell Wand (1.5x)</b></gold>"
      multiplier: 1.5
      essence-cost: 1500
    2:
      display-name: "<gradient:gold:light_purple><b>Master Sell Wand (2.5x)</b></gradient>"
      multiplier: 2.5
      essence-cost: 15000

# ==========================================
# Server Customization Settings (IP, Name, etc.)
# ==========================================
server:
  # The IP address displayed on the scoreboard and tab list footer
  ip: "gens.chyaro.xyz"
  # The display name of the server (supports MiniMessage color formatting)
  name: "<gradient:green:aqua><bold>GenSprout</bold></gradient>"
  # A short description tagline for the server
  tagline: "<gray>The ultimate farming server</gray>"
  discord: "https://discord.gg/bJjyy8q9wb"


# ==========================================
# Scoreboard Customization
# ==========================================
scoreboard:
  # Enable/disable the custom sidebar scoreboard
  enabled: true
  # How often the scoreboard updates (20 ticks = 1 second)
  update-interval-ticks: 20
  # Objective title at the top of the scoreboard (supports MiniMessage color formatting)
  title: "{servername}"
  # Configurable lines shown in the scoreboard sidebar
  # Available dynamic placeholders:
  #   {player}       - Current player's name
  #   {level}        - Current farming level
  #   {xp}           - Current farming XP formatted to 1 decimal place
  #   {prestige}     - Current prestige tier
  #   {essence}      - Current farming essence count
  #   {placed_gens}  - Count of generators placed by this player
  #   {max_gens}     - Maximum slots allowed for this player
  #   {balance}      - Vault economy balance formatted
  #   {server_ip}    - Server IP defined under 'server.ip'
  #   {server_name}  - Server name defined under 'server.name'
  #   {online}       - Total online players on the server
  #   {ping}         - Current player's ping in ms
  lines:
    - "<dark_aqua><b>PLAYER</b></dark_aqua>"
    - " <gray>Name:</gray> <white>{player}</white>"
    - " <gray>Level:</gray> <gold>{level}</gold>"
    - " <gray>Prestige:</gray> <light_purple>Prestige {prestige}</light_purple>"
    - ""
    - "<dark_aqua><b>ECONOMY</b></dark_aqua>"
    - " <gray>Essence:</gray> <light_purple>{essence}</light_purple>"
    - " <gray>Generators:</gray> <aqua>{placed_gens}</aqua><gray>/</gray><blue>{max_gens}</blue>"
    - " <gray>Balance:</gray> <green>{balance}</green>"
    - ""
    - "<yellow>{server_ip}</yellow>"

