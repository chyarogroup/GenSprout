    success-target: "<green>你从管理员那里获得了一支售卖魔杖。</green>"
  addxp:
    error-not-number: "<red>经验数量必须是数字！</red>"
    success-sender: "<green>已将 <gold><amount></gold> 点耕种经验添加给 <gold><player></gold>。</green>"
    success-target: "<green>你从管理员那里获得了 <gold><amount></gold> 点耕种经验。</green>"
  addessence:
    error-not-number: "<red>精华数量必须是数字！</red>"
