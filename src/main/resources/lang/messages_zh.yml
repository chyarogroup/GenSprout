    success-target: "<green>管理员已将你的转生设为 <gold><prestige></gold>。</green>"
  clearstats:
    usage: "<red>用法：<gold>/<command> clearstats <player></gold></red>"
    success-sender: "<green>已清除 <gold><player></gold> 的全部数据（等级、经验、转生、精华、金钱）。</green>"
    success-target: "<red>管理员已清除你的全部数据（等级、经验、转生、精华、金钱）。</red>"
