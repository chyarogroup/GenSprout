    error-not-number: "<red>阶级和数量都必须是数字！</red>"
    success-sender: "<green>已将 <gold><amount>x <tier> 阶生成器</gold> 给予 <gold><player></gold>。</green>"
    success-target: "<green>你获得了 <gold><amount>x <tier> 阶生成器</gold>！</green>"
  givegenslots:
    error-not-number: "<red>槽位数量必须是数字！</red>"
