# GenSprout - 简体中文翻译文件
#
# 占位符支持两种写法：<placeholder> 或 {placeholder}。两者解析出的值完全相同，
# 因此可以选用你觉得更易读的那种。
#
# 始终可用：{servername}、{servername_styled}、{server_ip}、{tagline}、{online}、
# {max_players}、{prefix}。面向玩家的消息还可使用 {player}、{ping} 和 {lang}。
#
# {servername} 是移除了所有格式的纯服务器名称，因此你可以放心地为它套上自己的
# 颜色和渐变。{servername_styled} 会保留 config.yml 中的原始标记。
#
# 金额数值已经包含货币符号，所以请写 <cost> 而不是 $<cost>。
#


prefix: "<gradient:green:aqua><b>{servername}</b></gradient> <dark_gray>»</dark_gray> "

system:
  no-permission: "<red>你没有权限执行此命令！</red>"
  player-only: "<red>只有玩家才能执行此命令！</red>"
  player-only-action: "<red>只有玩家才能<action>！</red>"
  player-not-found: "<red>找不到匹配 '<player>' 的玩家。</red>"
  reload-success: "<green>{servername} 的配置和语言文件已成功重新加载！</green>"
  unknown-subcommand: "<red>未知的子命令。输入 <gold>/<command> help</gold> 查看帮助。</red>"
  economy-disabled: "<red>本服务器未启用 Vault 经济系统。</red>"
  invalid-number: "<red><input> 不是有效的数字！</red>"

command:
  usage: "<red>用法：<gold>/<command> <help|start|givegen|givegenslots|addxp|addessence|addmoney|setlevel|setprestige|givehoe|givesellwand|clearstats|reload></gold></red>"
  admin-usage: "<red>用法：<gold>/<command> <subcommand> <player> <amount></gold></red>"
  opened:
    main: "<green>已为 <gold><player></gold> 打开主菜单。</green>"
    genshop: "<green>已为 <gold><player></gold> 打开生成器商店。</green>"
    prestige: "<green>已为 <gold><player></gold> 打开转生菜单。</green>"
    supplies: "<green>已为 <gold><player></gold> 打开建筑材料商店。</green>"
  executed:
    sellall: "<green>已为 <gold><player></gold> 执行售卖操作。</green>"
    start: "<green>已为 <gold><player></gold> 开始新手教程。</green>"
  start:
    already-completed: "<red>你已经完成新手教程并领取过初始物品了！</red>"
    success: "<green>新手教程已开始！你获得了一把<gradient:green:aqua>嫩芽锄</gradient>和 <gold><amount></gold> 个 1 阶生成器作为起步物资！</green>"
