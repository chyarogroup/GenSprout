    success-sender: "<green>已扣除 <gold><amount></gold> 点精华，来自 <gold><player></gold>。当前总量：<gold><total></gold>。</green>"
    success-target: "<red>管理员从你的余额中扣除了 <gold><amount></gold> 点精华。</red>"
  setessence:
    success-sender: "<green>已将 <gold><player></gold> 的精华余额设为 <gold><amount></gold>。</green>"
    success-target: "<green>管理员已将你的精华余额设为 <gold><amount></gold>。</green>"
  addmoney:
