  tutorial:
    title: "<gradient:green:aqua><b>{servername} Starter Guide</b></gradient>"
    welcome: "<gray>Welcome to <gold>{servername}</gold>, <yellow><player></yellow>! Here is everything you need to know:</gray>"
    lines:
      - "<gradient:yellow:gold><b>1. Farming & Progression</b></gradient>"
      - "<gray>Farm crops to earn Farming XP and Essence. Upgrade your <light_purple>Sprout Hoe</light_purple> with custom enchantments (Crop Doubler, Harvest Area, Replenish, Essence Finder, XP Booster).</gray>"
      - ""
      - "<gradient:green:aqua><b>2. Generators & Passive Income</b></gradient>"
      - "<gray>Place generators on your island or base to spawn drops automatically. Generators produce live drops while you are online, plus <gold>20% offline earnings</gold> when you log back in!</gray>"
      - ""
      - "<gradient:gold:yellow><b>3. Essential Commands</b></gradient>"
      - "<gray>• <yellow>/shop</yellow> - Open the main Shop (Generators, Tools, and Building Materials)</gray>"
      - "<gray>• <yellow>/genshop</yellow> - Buy generator tiers and purchase extra generator slots</gray>"
      - "<gray>• <yellow>/sell</yellow> - Sell all crops and generator drops instantly</gray>"
      - "<gray>• <yellow>/prestige</yellow> - Reset level for permanent XP, Money & Essence multipliers</gray>"
      - "<gray>• <yellow>/gensprout</yellow> - Open the main navigation menu & hoe upgrades</gray>"
    next: "Next Step"
    close: "<green>✔ Start Playing</green>"
    button-genshop: "<sprite:block/diamond_block> <gradient:green:aqua>Generator Shop</gradient>"
    button-shop: '<sprite:"minecraft:items":item/netherite_pickaxe> <gradient:gold:yellow>Shop</gradient>'

