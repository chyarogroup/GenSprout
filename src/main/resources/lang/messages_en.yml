# GenSprout - English translation bundle
#
# Placeholders work in either style: <placeholder> or {placeholder}. Both resolve to the same
# value, so use whichever reads better to you.
#
# Always available: {servername}, {servername_styled}, {server_ip}, {tagline}, {online},
# {max_players}, {prefix}. Player-facing messages also get {player}, {ping} and {lang}.
#
# {servername} is the plain server name with formatting removed, so you can safely wrap it in
# your own colours and gradients. {servername_styled} keeps the exact markup from config.yml.
#
# Money values already include the currency symbol, so write <cost> and not $<cost>.
#


prefix: "<gradient:green:aqua><b>{servername}</b></gradient> <dark_gray>»</dark_gray> "

system:
  no-permission: "<red>You do not have permission to execute this command!</red>"
  player-only: "<red>Only players can execute this command!</red>"
  player-only-action: "<red>Only players can <action>!</red>"
  player-not-found: "<red>No players found matching '<player>'.</red>"
  reload-success: "<green>{servername} configuration and language files reloaded successfully!</green>"
  unknown-subcommand: "<red>Unknown subcommand. Type <gold>/<command> help</gold> for help.</red>"
  economy-disabled: "<red>Vault economy is not enabled on this server.</red>"
  invalid-number: "<red><input> is not a valid number!</red>"

command:
  usage: "<red>Usage: <gold>/<command> <help|start|givegen|givegenslots|addxp|addessence|addmoney|setlevel|setprestige|givehoe|givesellwand|clearstats|reload></gold></red>"
  admin-usage: "<red>Usage: <gold>/<command> <subcommand> <player> <amount></gold></red>"
  opened:
    main: "<green>Opened the Main Menu for <gold><player></gold>.</green>"
    genshop: "<green>Opened the Generator Shop for <gold><player></gold>.</green>"
    prestige: "<green>Opened the Prestige Menu for <gold><player></gold>.</green>"
    supplies: "<green>Opened the Building Supplies Shop for <gold><player></gold>.</green>"
  executed:
    sellall: "<green>Executed the sell action for <gold><player></gold>.</green>"
    start: "<green>Started the tutorial for <gold><player></gold>.</green>"
  start:
    already-completed: "<red>You have already completed the tutorial and claimed your starter items!</red>"
    success: "<green>Tutorial started! You received a <gradient:green:aqua>Sprout Hoe</gradient> and <gold><amount></gold> Tier 1 Generators to get started!</green>"
  givegen:
    usage: "<red>Usage: <gold>/<command> givegen <player> <tier> [amount]</gold></red>"
    invalid-tier: "<red>Invalid generator tier! Choose between 1 and <max_tier>.</red>"
    error-not-number: "<red>Tier and amount must both be numbers!</red>"
    success-sender: "<green>Gave <gold><amount>x Tier <tier> Generator(s)</gold> to <gold><player></gold>.</green>"
    success-target: "<green>You received <gold><amount>x Tier <tier> Generator(s)</gold>!</green>"
  givegenslots:
    error-not-number: "<red>Slot amount must be a number!</red>"
    success-sender: "<green>Gave <gold><amount></gold> extra generator slot(s) to <gold><player></gold>.</green>"
    success-target: "<green>You received <gold><amount></gold> extra generator slot(s) from an admin.</green>"
  givehoe:
    usage: "<red>Usage: <gold>/<command> givehoe <player></gold></red>"
    success-sender: "<green>Gave a Sprout Hoe to <gold><player></gold>.</green>"
    success-target: "<green>You received a Sprout Hoe from an admin.</green>"
  givesellwand:
    usage: "<red>Usage: <gold>/<command> givesellwand <player> [tier]</gold></red>"
    error-not-number: "<red>Tier must be a number!</red>"
    success-sender: "<green>Gave a Sell Wand (Tier <gold><tier></gold>) to <gold><player></gold>.</green>"
    success-target: "<green>You received a Sell Wand from an admin.</green>"
  addxp:
    error-not-number: "<red>XP amount must be a number!</red>"
    success-sender: "<green>Added <gold><amount></gold> Farming XP to <gold><player></gold>.</green>"
    success-target: "<green>You received <gold><amount></gold> Farming XP from an admin.</green>"
  addessence:
    error-not-number: "<red>Essence amount must be a number!</red>"
    success-sender: "<green>Added <gold><amount></gold> Essence to <gold><player></gold>.</green>"
    success-target: "<green>You received <gold><amount></gold> Essence from an admin.</green>"
  removeessence:
    success-sender: "<green>Removed <gold><amount></gold> Essence from <gold><player></gold>. New total: <gold><total></gold>.</green>"
    success-target: "<red>An admin removed <gold><amount></gold> Essence from your balance.</red>"
  setessence:
    success-sender: "<green>Set <gold><player></gold>'s Essence balance to <gold><amount></gold>.</green>"
    success-target: "<green>Your Essence balance was set to <gold><amount></gold> by an admin.</green>"
  addmoney:
    error-not-number: "<red>Amount must be a number!</red>"
    success-sender: "<green>Gave <gold><amount></gold> to <gold><player></gold>.</green>"
    success-target: "<green>You received <gold><amount></gold> from an admin.</green>"
  setlevel:
    error-not-number: "<red>Level must be a number!</red>"
    success-sender: "<green>Set <gold><player></gold>'s Farming Level to <gold><level></gold>.</green>"
    success-target: "<green>Your Farming Level was set to <gold><level></gold> by an admin.</green>"
  setprestige:
    error-not-number: "<red>Prestige must be a number!</red>"
    success-sender: "<green>Set <gold><player></gold>'s Prestige to <gold><prestige></gold>.</green>"
    success-target: "<green>Your Prestige was set to <gold><prestige></gold> by an admin.</green>"
  clearstats:
    usage: "<red>Usage: <gold>/<command> clearstats <player></gold></red>"
    success-sender: "<green>Cleared all stats (Level, XP, Prestige, Essence, Money) for <gold><player></gold>.</green>"
    success-target: "<red>All your stats (Level, XP, Prestige, Essence, Money) were cleared by an admin.</red>"
    success-offline: "<green>Cleared all stats for offline player <gold><player></gold>.</green>"
  farm:
    selector-given: "<green>Received the Farm Selector Stick. Left-click and right-click to set both corners, then run <gold>/<command> savefarm</gold> to define the region.</green>"
    no-selection: "<red>You have not selected both positions! Left-click and right-click with the Farm Selector Stick first.</red>"
    different-world: "<red>Both positions must be in the same world!</red>"
    pos1: "<green>Farm corner #1 set to <gold><x>, <y>, <z></gold> in <gold><world></gold>.</green>"
    pos2: "<green>Farm corner #2 set to <gold><x>, <y>, <z></gold> in <gold><world></gold>.</green>"
    saved: "<green>Farm region defined and saved successfully!</green>"
    populated: "<green>Farm region populated with farmland and wheat crops!</green>"

