    success-target: "<green>¡Recibiste <gold><amount>x Generador(es) de Tier <tier></gold>!</green>"
  givegenslots:
    error-not-number: "<red>¡La cantidad de ranuras debe ser un número!</red>"
    success-sender: "<green>Le diste <gold><amount></gold> ranura(s) de generador extra a <gold><player></gold>.</green>"
    success-target: "<green>Recibiste <gold><amount></gold> ranura(s) de generador extra de un administrador.</green>"
  givehoe:
    usage: "<red>Uso: <gold>/<command> givehoe <player></gold></red>"
    success-sender: "<green>Le diste una Azada Sprout a <gold><player></gold>.</green>"
    success-target: "<green>Recibiste una Azada Sprout de un administrador.</green>"
  givesellwand:
    usage: "<red>Uso: <gold>/<command> givesellwand <player> [tier]</gold></red>"
    error-not-number: "<red>¡El tier debe ser un número!</red>"
