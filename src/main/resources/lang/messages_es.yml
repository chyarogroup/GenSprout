# GenSprout - Paquete de traduccion al espanol
#
# Los marcadores funcionan en cualquiera de los dos estilos: <placeholder> o {placeholder}. Ambos
# devuelven el mismo valor, asi que usa el que te resulte mas comodo.
#
# Siempre disponibles: {servername}, {servername_styled}, {server_ip}, {tagline}, {online},
# {max_players}, {prefix}. Los mensajes dirigidos a jugadores tambien reciben {player}, {ping} y {lang}.
#
# {servername} es el nombre del servidor sin formato, asi que puedes envolverlo con tus propios
# colores y degradados sin problema. {servername_styled} conserva el formato exacto de config.yml.
#
# Los valores monetarios ya incluyen el simbolo de la moneda, asi que escribe <cost> y no $<cost>.
#
# file-version sirve para detectar archivos desactualizados tras una actualizacion del plugin. No lo
# elimines. Cuando el plugin incluya una version mas nueva, tu archivo anterior se renombra a .old y
# el nuevo se escribe en su lugar, asi que guarda una copia de los cambios que quieras conservar.
file-version: 4

prefix: "<gradient:green:aqua><b>{servername}</b></gradient> <dark_gray>»</dark_gray> "

system:
  no-permission: "<red>¡No tienes permiso para ejecutar este comando!</red>"
  player-only: "<red>¡Solo los jugadores pueden ejecutar este comando!</red>"
  player-only-action: "<red>¡Solo los jugadores pueden <action>!</red>"
  player-not-found: "<red>No se encontraron jugadores que coincidan con '<player>'.</red>"
  reload-success: "<green>¡La configuración y los archivos de idioma de {servername} se recargaron correctamente!</green>"
  unknown-subcommand: "<red>Subcomando desconocido. Escribe <gold>/<command> help</gold> para ver la ayuda.</red>"
  economy-disabled: "<red>La economía de Vault no está habilitada en este servidor.</red>"
  invalid-number: "<red>¡<input> no es un número válido!</red>"

command:
  usage: "<red>Uso: <gold>/<command> <help|start|givegen|givegenslots|addxp|addessence|addmoney|setlevel|setprestige|givehoe|givesellwand|clearstats|reload></gold></red>"
  admin-usage: "<red>Uso: <gold>/<command> <subcommand> <player> <amount></gold></red>"
  opened:
    main: "<green>Se abrió el Menú Principal para <gold><player></gold>.</green>"
    genshop: "<green>Se abrió la Tienda de Generadores para <gold><player></gold>.</green>"
