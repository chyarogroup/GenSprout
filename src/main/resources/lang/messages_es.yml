    success-target: "<green>Recibiste una Vara de venta de un administrador.</green>"
  addxp:
    error-not-number: "<red>¡La cantidad de XP debe ser un número!</red>"
    success-sender: "<green>Le añadiste <gold><amount></gold> de XP de cultivo a <gold><player></gold>.</green>"
    success-target: "<green>Recibiste <gold><amount></gold> de XP de cultivo de un administrador.</green>"
  addessence:
    error-not-number: "<red>¡La cantidad de Esencia debe ser un número!</red>"
    success-sender: "<green>Le añadiste <gold><amount></gold> de Esencia a <gold><player></gold>.</green>"
    success-target: "<green>Recibiste <gold><amount></gold> de Esencia de un administrador.</green>"
  removeessence:
    success-sender: "<green>Le quitaste <gold><amount></gold> de Esencia a <gold><player></gold>. Nuevo total: <gold><total></gold>.</green>"
    success-target: "<red>Un administrador quitó <gold><amount></gold> de Esencia de tu saldo.</red>"
  setessence:
    success-sender: "<green>Estableciste la Esencia de <gold><player></gold> en <gold><amount></gold>.</green>"
    success-target: "<green>Un administrador estableció tu Esencia en <gold><amount></gold>.</green>"
  addmoney:
    error-not-number: "<red>¡La cantidad debe ser un número!</red>"
    success-sender: "<green>Le diste <gold><amount></gold> a <gold><player></gold>.</green>"
    success-target: "<green>Recibiste <gold><amount></gold> de un administrador.</green>"
  setlevel:
    error-not-number: "<red>¡El nivel debe ser un número!</red>"
    success-sender: "<green>Estableciste el Nivel de cultivo de <gold><player></gold> en <gold><level></gold>.</green>"
    success-target: "<green>Un administrador estableció tu Nivel de cultivo en <gold><level></gold>.</green>"
  setprestige:
    error-not-number: "<red>¡El prestigio debe ser un número!</red>"
    success-sender: "<green>Estableciste el Prestigio de <gold><player></gold> en <gold><prestige></gold>.</green>"
    success-target: "<green>Un administrador estableció tu Prestigio en <gold><prestige></gold>.</green>"
  clearstats:
    usage: "<red>Uso: <gold>/<command> clearstats <player></gold></red>"
    success-sender: "<green>Borraste todas las estadísticas (Nivel, XP, Prestigio, Esencia, Dinero) de <gold><player></gold>.</green>"
    success-target: "<red>Un administrador borró todas tus estadísticas (Nivel, XP, Prestigio, Esencia, Dinero).</red>"
    success-offline: "<green>Se borraron todas las estadísticas del jugador desconectado <gold><player></gold>.</green>"
  farm:
    selector-given: "<green>Recibiste la Vara Selectora de Granja. Haz clic izquierdo y clic derecho para marcar ambas esquinas y luego usa <gold>/<command> savefarm</gold> para definir la región.</green>"
