    success-target: "<green>Vous avez reçu <gold><amount></gold> XP d'agriculture d'un administrateur.</green>"
  addessence:
    error-not-number: "<red>La quantité d'Essence doit être un nombre !</red>"
    success-sender: "<green><gold><amount></gold> Essence ajoutée à <gold><player></gold>.</green>"
    success-target: "<green>Vous avez reçu <gold><amount></gold> Essence d'un administrateur.</green>"
