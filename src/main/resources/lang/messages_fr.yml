    success-sender: "<green>Solde d'Essence de <gold><player></gold> défini à <gold><amount></gold>.</green>"
    success-target: "<green>Votre solde d'Essence a été défini à <gold><amount></gold> par un administrateur.</green>"
  addmoney:
    error-not-number: "<red>Le montant doit être un nombre !</red>"
    success-sender: "<green><gold><amount></gold> donné(s) à <gold><player></gold>.</green>"
    success-target: "<green>Vous avez reçu <gold><amount></gold> d'un administrateur.</green>"
  setlevel:
    error-not-number: "<red>Le niveau doit être un nombre !</red>"
