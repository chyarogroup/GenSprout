# GenSprout - Pack de traduction française
#
# Les placeholders fonctionnent dans les deux styles : <placeholder> ou {placeholder}. Les deux
# renvoient la même valeur, utilisez donc celui qui vous semble le plus lisible.
#
# Toujours disponibles : {servername}, {servername_styled}, {server_ip}, {tagline}, {online},
# {max_players}, {prefix}. Les messages destinés aux joueurs disposent aussi de {player}, {ping} et {lang}.
#
# {servername} est le nom du serveur sans mise en forme, vous pouvez donc l'entourer de vos propres
# couleurs et dégradés. {servername_styled} conserve exactement le balisage défini dans config.yml.
#
# Les montants incluent déjà le symbole monétaire : écrivez <cost> et non $<cost>.
#
# file-version sert à détecter les fichiers obsolètes après une mise à jour du plugin. Ne le supprimez
# pas. Lorsque le plugin fournit une version plus récente, votre ancien fichier est renommé en .old et
# le nouveau est écrit à sa place : conservez une copie des modifications que vous souhaitez reporter.
file-version: 4

prefix: "<gradient:green:aqua><b>{servername}</b></gradient> <dark_gray>»</dark_gray> "

system:
  no-permission: "<red>Vous n'avez pas la permission d'exécuter cette commande !</red>"
  player-only: "<red>Seuls les joueurs peuvent exécuter cette commande !</red>"
  player-only-action: "<red>Seuls les joueurs peuvent <action> !</red>"
  player-not-found: "<red>Aucun joueur trouvé correspondant à '<player>'.</red>"
  reload-success: "<green>Configuration et fichiers de langue de {servername} rechargés avec succès !</green>"
  unknown-subcommand: "<red>Sous-commande inconnue. Tapez <gold>/<command> help</gold> pour obtenir de l'aide.</red>"
  economy-disabled: "<red>L'économie Vault n'est pas activée sur ce serveur.</red>"
  invalid-number: "<red><input> n'est pas un nombre valide !</red>"

command:
