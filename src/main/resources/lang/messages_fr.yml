    success-target: "<red>Toutes vos statistiques (niveau, XP, prestige, Essence, argent) ont été effacées par un administrateur.</red>"
    success-offline: "<green>Toutes les statistiques du joueur hors ligne <gold><player></gold> ont été effacées.</green>"
  farm:
    selector-given: "<green>Vous avez reçu le Bâton de sélection de ferme. Faites un clic gauche et un clic droit pour définir les deux coins, puis lancez <gold>/<command> savefarm</gold> pour définir la région.</green>"
