# GenSprout - Deutsches Sprachpaket
#
# Platzhalter funktionieren in beiden Schreibweisen: <placeholder> oder {placeholder}. Beide liefern
# denselben Wert, nutze also die, die dir besser gefällt.
#
# Immer verfügbar: {servername}, {servername_styled}, {server_ip}, {tagline}, {online},
# {max_players}, {prefix}. Nachrichten an Spieler erhalten zusätzlich {player}, {ping} und {lang}.
#
# {servername} ist der reine Servername ohne Formatierung, du kannst ihn also gefahrlos in eigene
# Farben und Gradienten einpacken. {servername_styled} behält das Markup aus der config.yml bei.
#
# Geldbeträge enthalten das Währungssymbol bereits, schreibe also <cost> und nicht $<cost>.
#
# file-version dient dazu, veraltete Dateien nach einem Plugin-Update zu erkennen. Nicht entfernen!
# Wenn das Plugin eine neuere Version mitbringt, wird deine alte Datei in .old umbenannt und die neue
# an ihre Stelle geschrieben. Bewahre also eine Kopie deiner Änderungen auf.
file-version: 4

prefix: "<gradient:green:aqua><b>{servername}</b></gradient> <dark_gray>»</dark_gray> "

system:
  no-permission: "<red>Du hast keine Berechtigung, diesen Befehl auszuführen!</red>"
  player-only: "<red>Nur Spieler können diesen Befehl ausführen!</red>"
  player-only-action: "<red>Nur Spieler können <action>!</red>"
  player-not-found: "<red>Keine Spieler gefunden, die zu '<player>' passen.</red>"
  reload-success: "<green>Konfiguration und Sprachdateien von {servername} erfolgreich neu geladen!</green>"
  unknown-subcommand: "<red>Unbekannter Unterbefehl. Tippe <gold>/<command> help</gold> für Hilfe.</red>"
  economy-disabled: "<red>Die Vault-Wirtschaft ist auf diesem Server nicht aktiviert.</red>"
  invalid-number: "<red><input> ist keine gültige Zahl!</red>"

